<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>02. 할로윈 몬스터볼 준비물</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "Apple SD Gothic Neo", "Noto Sans KR", Arial, sans-serif;
      background: #f7f7f7;
      color: #222;
    }

    .container {
      max-width: 640px;
      margin: 0 auto;
      padding: 32px 20px 48px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 28px;
      line-height: 1.35;
    }

    .summary {
      margin-bottom: 28px;
      color: #666;
      font-size: 16px;
      line-height: 1.7;
    }

    .item-list {
      display: grid;
      gap: 12px;
    }

    .item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 18px;
      padding: 18px 20px;
      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 12px;
      color: #111;
      text-decoration: none;
      transition: 0.15s ease;
    }

    .item:hover {
      transform: translateY(-2px);
      border-color: #999;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
    }

    .item-name {
      font-size: 18px;
      font-weight: 700;
      line-height: 1.45;
    }

    .item-price {
      flex: 0 0 auto;
      font-size: 16px;
      font-weight: 700;
      color: #555;
    }

    .notice {
      margin-top: 32px;
      padding-top: 20px;
      border-top: 1px solid #ddd;
      color: #888;
      font-size: 12px;
      line-height: 1.6;
    }

    @media (max-width: 480px) {
      h1 { font-size: 24px; }

      .item {
        align-items: flex-start;
        flex-direction: column;
        gap: 6px;
      }

      .item-price {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>02. 할로윈 몬스터볼 준비물</h1>

    <div class="summary">
      필요 아이템 수 : 6개<br />
      총 예상 금액 : 38,720원
    </div>

    <div class="item-list">
      <a class="item" href="https://link.coupang.com/a/hPJv0FeGf6" target="_blank" rel="sponsored nofollow noopener">
        <span class="item-name">1. a2 골판지 30장</span>
        <span class="item-price">19,000원</span>
      </a>
      <a class="item" href="https://link.coupang.com/a/hPJrqk6sLY" target="_blank" rel="sponsored nofollow noopener">
        <span class="item-name">2. 어린이안전인증 아크릴 물감 RED</span>
        <span class="item-price">4,400원</span>
      </a>
      <a class="item" href="https://link.coupang.com/a/hPJiPxHd2y" target="_blank" rel="sponsored nofollow noopener">
        <span class="item-name">3. 어린이안전인증 아크릴 물감 WHITE</span>
        <span class="item-price">4,600원</span>
      </a>
      <a class="item" href="https://link.coupang.com/a/hPJgYEttWm" target="_blank" rel="sponsored nofollow noopener">
        <span class="item-name">4. 5CM 검정 테이프</span>
        <span class="item-price">3,010원</span>
      </a>
      <a class="item" href="https://link.coupang.com/a/hPJeXtDlng" target="_blank" rel="sponsored nofollow noopener">
        <span class="item-name">5. 페인트롤러 2개</span>
        <span class="item-price">4,700원</span>
      </a>
      <a class="item" href="https://link.coupang.com/a/hPJc8o3L40" target="_blank" rel="sponsored nofollow noopener">
        <span class="item-name">6. 목공풀 2개</span>
        <span class="item-price">3,010원</span>
      </a>
    </div>

    <div class="notice">
      이 페이지는 쿠팡 파트너스 활동의 일환으로,
      이에 따른 일정액의 수수료를 제공받을 수 있습니다.
    </div>
  </main>
</body>
</html>
